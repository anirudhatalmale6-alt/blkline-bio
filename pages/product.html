<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product — BLKLINE BIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="../index.html" class="logo">
        <img src="../images/logo-dark.jpg" alt="BLKLINE BIO">
        <div>
          <div class="logo-text">BLKLINE BIO</div>
          <div class="logo-tagline">Precision. Performance. Biology.</div>
        </div>
      </a>
      <nav class="nav">
        <a href="../index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-icons">
        <a href="#" class="nav-icon" onclick="openCart();return false;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
        <button class="mobile-toggle" onclick="toggleMobileNav()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <a href="../index.html" onclick="toggleMobileNav()">Home</a>
    <a href="products.html" onclick="toggleMobileNav()">Products</a>
    <a href="about.html" onclick="toggleMobileNav()">About</a>
    <a href="contact.html" onclick="toggleMobileNav()">Contact</a>
  </div>

  <section class="section product-detail">
    <div class="container">
      <div style="margin-bottom:32px">
        <a href="products.html" style="font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--silver-dark)">&larr; Back to Products</a>
      </div>
      <div class="product-detail-grid" id="productDetail"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-header fade-up">
        <div class="section-label">You May Also Like</div>
        <h2 class="section-title">Related Products</h2>
        <div class="section-line"></div>
      </div>
      <div class="products-grid" id="relatedProducts"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 BLKLINE BIO. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header"><h3>Your Cart</h3><button class="cart-close" onclick="closeCart()">&times;</button></div>
    <div class="cart-items" id="cartItems"><div class="cart-empty">Your cart is empty</div></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><span id="cartTotal">$0.00</span></div>
      <button class="btn-checkout" id="cartCheckoutBtn" onclick="goToCheckout()" disabled>Proceed to Checkout</button>
    </div>
  </div>

  <a href="#" class="whatsapp-float" id="whatsappBtn" title="Chat on WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <div class="toast" id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
    <span class="toast-msg"></span>
  </div>

  <script src="../js/app.js"></script>
  <script>
    let detailQty = 1;
    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get('id'));
    const product = PRODUCTS.find(p => p.id === productId);

    function goToProduct(id) { window.location.href = `product.html?id=${id}`; }

    if (product) {
      document.title = `${product.name} — BLKLINE BIO`;
      const specsHtml = product.specs ? Object.entries(product.specs).map(([k,v]) =>
        `<div class="spec-row"><span class="label">${k}</span><span class="value">${v}</span></div>`
      ).join('') : '';

      document.getElementById('productDetail').innerHTML = `
        <div class="product-detail-image fade-up">
          ${vialSVG.replace('width="64"','width="120"').replace('height="64"','height="120"')}
        </div>
        <div class="product-detail-info fade-up">
          <div class="category">${product.category}</div>
          <h1>${product.name}</h1>
          <div class="price">$${product.price.toFixed(2)} <span style="font-size:.9rem;color:var(--silver-dark)">${product.currency}</span></div>
          <div class="description">${product.desc}</div>
          <div class="qty-selector">
            <label>Quantity</label>
            <div class="qty-controls">
              <button onclick="changeQty(-1)">&minus;</button>
              <span id="qtyValue">1</span>
              <button onclick="changeQty(1)">+</button>
            </div>
          </div>
          <button class="btn btn-primary btn-add-large" onclick="addToCart(${product.id}, detailQty)">Add to Cart — $<span id="totalPrice">${product.price.toFixed(2)}</span></button>
          ${specsHtml ? `<div class="product-specs"><h3 style="font-family:var(--font-display);font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--white);margin-bottom:16px">Specifications</h3>${specsHtml}</div>` : ''}
        </div>
      `;

      const related = PRODUCTS.filter(p => p.id !== product.id && p.category === product.category).slice(0,4);
      if (related.length === 0) {
        renderProducts('relatedProducts', PRODUCTS.filter(p => p.id !== product.id).slice(0,4));
      } else {
        renderProducts('relatedProducts', related);
      }
      observeFadeUp();
    }

    function changeQty(d) {
      detailQty = Math.max(1, detailQty + d);
      document.getElementById('qtyValue').textContent = detailQty;
      document.getElementById('totalPrice').textContent = (product.price * detailQty).toFixed(2);
    }
  </script>
</body>
</html>
