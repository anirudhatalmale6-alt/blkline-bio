<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders — BLKLINE BIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-login{max-width:400px;margin:140px auto;text-align:center;padding:40px}
    .admin-login input{width:100%;padding:12px 16px;background:var(--dark3);border:1px solid rgba(192,192,192,.1);border-radius:var(--radius);color:var(--white);font-size:.9rem;margin:16px 0}
    .orders-panel{padding-top:120px;max-width:960px;margin:0 auto;padding-left:20px;padding-right:20px;padding-bottom:60px}
    .order-card{background:var(--dark2);border:1px solid rgba(192,192,192,.08);border-radius:var(--radius);padding:24px;margin-bottom:16px}
    .order-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(192,192,192,.06)}
    .order-id{font-family:var(--font-display);font-size:.85rem;letter-spacing:2px;color:var(--silver)}
    .order-date{font-size:.75rem;color:var(--silver-dark)}
    .order-status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.65rem;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-display)}
    .order-status.paid{background:rgba(37,211,102,.12);color:#25D366}
    .order-status.unpaid{background:rgba(231,76,60,.12);color:#e74c3c}
    .order-customer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;font-size:.8rem}
    .order-customer .label{color:var(--silver-dark);font-size:.7rem;text-transform:uppercase;letter-spacing:1px;font-family:var(--font-display);margin-bottom:2px}
    .order-customer .value{color:var(--white)}
    .order-items{margin-bottom:12px}
    .order-item{display:flex;justify-content:space-between;padding:6px 0;font-size:.8rem;border-bottom:1px solid rgba(192,192,192,.03)}
    .order-item .name{color:var(--white)}
    .order-item .qty{color:var(--silver-dark);margin-left:8px}
    .order-item .price{color:var(--silver);font-family:var(--font-display);letter-spacing:1px}
    .order-total{display:flex;justify-content:space-between;padding-top:8px;font-size:.85rem;font-weight:600}
    .order-total .label{color:var(--white)}
    .order-total .amount{color:var(--silver);font-family:var(--font-display);letter-spacing:1px;font-size:.95rem}
    .order-shipping{margin-top:12px;padding:12px;background:var(--dark3);border-radius:var(--radius);font-size:.78rem;color:var(--white-muted)}
    .order-shipping .label{color:var(--silver-dark);font-size:.65rem;text-transform:uppercase;letter-spacing:1px;font-family:var(--font-display);margin-bottom:4px}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
    .stat-card{background:var(--dark2);border:1px solid rgba(192,192,192,.08);border-radius:var(--radius);padding:20px;text-align:center}
    .stat-value{font-family:var(--font-display);font-size:1.4rem;letter-spacing:2px;color:var(--white);margin-bottom:4px}
    .stat-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--silver-dark);font-family:var(--font-display)}
    .refresh-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}
    .refresh-bar button{padding:8px 20px;font-family:var(--font-display);font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;background:var(--dark3);color:var(--silver);border:1px solid rgba(192,192,192,.1);border-radius:var(--radius);cursor:pointer}
    .refresh-bar button:hover{background:var(--silver);color:var(--black)}
    .auto-refresh{font-size:.7rem;color:var(--silver-dark)}
    .no-orders{text-align:center;padding:60px 20px;color:var(--silver-dark);font-size:.85rem}
    .admin-nav{display:flex;gap:12px;margin-bottom:24px}
    .admin-nav a{padding:10px 20px;font-family:var(--font-display);font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;background:var(--dark3);color:var(--silver-dark);border:1px solid rgba(192,192,192,.08);border-radius:var(--radius);text-decoration:none;transition:var(--transition)}
    .admin-nav a:hover{border-color:rgba(192,192,192,.2)}
    .admin-nav a.active{background:var(--silver);color:var(--black);border-color:var(--silver)}
    @media(max-width:600px){
      .order-customer{grid-template-columns:1fr}
      .stats-row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

  <div class="admin-login" id="loginPanel">
    <h2 style="font-family:var(--font-display);font-size:1.2rem;letter-spacing:4px;text-transform:uppercase;color:var(--white)">Admin Access</h2>
    <input type="password" id="adminPass" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')checkLogin()">
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="checkLogin()">Login</button>
    <p id="loginError" style="color:#e74c3c;font-size:.8rem;margin-top:12px;display:none">Incorrect password</p>
  </div>

  <div class="orders-panel" id="ordersPanel" style="display:none">
    <h1 style="font-family:var(--font-display);font-size:1.4rem;letter-spacing:4px;text-transform:uppercase;color:var(--white);margin-bottom:8px">Order Dashboard</h1>
    <p style="color:var(--silver-dark);font-size:.8rem;margin-bottom:20px">View all orders with real product names and customer details.</p>

    <div class="admin-nav">
      <a href="orders.html" class="active">Orders</a>
      <a href="admin.html">Stock Manager</a>
    </div>

    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-value" id="statOrders">-</div><div class="stat-label">Total Orders</div></div>
      <div class="stat-card"><div class="stat-value" id="statRevenue">-</div><div class="stat-label">Revenue (AUD)</div></div>
      <div class="stat-card"><div class="stat-value" id="statItems">-</div><div class="stat-label">Items Sold</div></div>
    </div>

    <div class="refresh-bar">
      <div>
        <button onclick="loadOrders()">Refresh Orders</button>
        <span class="auto-refresh" id="autoRefreshLabel">Auto-refresh: every 30s</span>
      </div>
      <span class="auto-refresh" id="lastRefresh"></span>
    </div>

    <div id="ordersList"></div>
  </div>

  <script>
    var API_URL = 'https://app.factukey.com/blkline-stripe';
    var ADMIN_PASS = 'blkadmin2026';
    var refreshTimer;

    function checkLogin() {
      var pass = document.getElementById('adminPass').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('ordersPanel').style.display = 'block';
        loadOrders();
        refreshTimer = setInterval(loadOrders, 30000);
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function loadOrders() {
      document.getElementById('lastRefresh').textContent = 'Loading...';
      fetch(API_URL + '/orders?key=' + ADMIN_PASS)
        .then(function(r) { return r.json(); })
        .then(function(orders) {
          renderStats(orders);
          renderOrders(orders);
          document.getElementById('lastRefresh').textContent = 'Updated: ' + new Date().toLocaleTimeString();
        })
        .catch(function(err) {
          document.getElementById('lastRefresh').textContent = 'Error loading orders';
        });
    }

    function renderStats(orders) {
      var totalOrders = orders.length;
      var totalRevenue = orders.reduce(function(sum, o) { return sum + parseFloat(o.total); }, 0);
      var totalItems = orders.reduce(function(sum, o) {
        return sum + o.items.reduce(function(s, i) { return s + i.quantity; }, 0);
      }, 0);
      document.getElementById('statOrders').textContent = totalOrders;
      document.getElementById('statRevenue').textContent = '$' + totalRevenue.toFixed(2);
      document.getElementById('statItems').textContent = totalItems;
    }

    function renderOrders(orders) {
      var container = document.getElementById('ordersList');
      if (orders.length === 0) {
        container.innerHTML = '<div class="no-orders">No orders yet. They will appear here automatically when customers pay.</div>';
        return;
      }
      container.innerHTML = orders.map(function(order) {
        var date = new Date(order.date);
        var dateStr = date.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

        var itemsHtml = order.items.map(function(item) {
          return '<div class="order-item">' +
            '<div><span class="name">' + item.realName + '</span><span class="qty"> x' + item.quantity + '</span></div>' +
            '<span class="price">$' + item.amount + '</span>' +
          '</div>';
        }).join('');

        var shippingHtml = '';
        if (order.shipping && order.shipping.address) {
          var addr = order.shipping.address;
          var parts = [order.shipping.name, addr.line1, addr.line2, addr.city, addr.state, addr.postal_code, addr.country].filter(Boolean);
          shippingHtml = '<div class="order-shipping"><div class="label">Ship To</div>' + parts.join(', ') + '</div>';
        }

        var customerHtml = '<div class="order-customer">';
        customerHtml += '<div><div class="label">Customer</div><div class="value">' + (order.customerName || '-') + '</div></div>';
        customerHtml += '<div><div class="label">Email</div><div class="value">' + (order.customerEmail || '-') + '</div></div>';
        if (order.customerPhone) {
          customerHtml += '<div><div class="label">Phone</div><div class="value">' + order.customerPhone + '</div></div>';
        }
        customerHtml += '</div>';

        return '<div class="order-card">' +
          '<div class="order-header">' +
            '<div><span class="order-id">' + order.id + '</span></div>' +
            '<div style="display:flex;align-items:center;gap:10px">' +
              '<span class="order-date">' + dateStr + '</span>' +
              '<span class="order-status ' + order.status + '">' + order.status + '</span>' +
            '</div>' +
          '</div>' +
          customerHtml +
          '<div class="order-items">' + itemsHtml + '</div>' +
          '<div class="order-total"><span class="label">Total</span><span class="amount">$' + order.total + ' ' + order.currency + '</span></div>' +
          shippingHtml +
        '</div>';
      }).join('');
    }
  </script>
</body>
</html>
